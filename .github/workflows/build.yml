name: Build

on:
  push:
  pull_request:

  # Cutting a release from the Actions tab: run this workflow, fill in a tag
  # like v0.2.0, and it builds all three platforms, creates the tag, and
  # publishes the release with RELEASE_NOTES.md attached to it. Leaving the
  # tag empty just builds, as an ordinary run does.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (e.g. v0.2.0). Leave empty to only build."
        required: false
        default: ""
      prerelease:
        # False by default because passing a tag at all is the decision to
        # release: a dispatch with no tag does not publish anything, so the
        # only way to reach this is to have meant it. Defaulting to true
        # published v0.5.0 as a pre-release, which left the previous version
        # showing as the latest one on the releases page.
        description: "Mark the release as a pre-release"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  # The arithmetic that would be silently wrong, checked before anything is
  # compiled. This finishes in seconds because the headers it covers are
  # deliberately free of JUCE, so a broken warp mapping or latency sum is
  # reported long before the three platform builds have fetched their
  # dependencies, and it reads as its own failure rather than as a build error.
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run standalone tests
        run: ./Tests/run.sh

  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    # The build still runs when a test fails, because knowing whether the code
    # compiles on all three platforms is useful even while a test is red. What
    # a red test does stop is the release below: a bounce that does not line up
    # must not reach anyone as a download.
    needs: tests
    if: ${{ !cancelled() }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxi-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libglu1-mesa-dev mesa-common-dev

      # ASIO is how an audio interface is actually played through on Windows.
      # Until 15 October 2025 the SDK could not be shipped with a GPL family
      # project at all, because its licence was proprietary only and imposed
      # terms the GPL forbids adding. On that date Steinberg dual licensed it
      # under GPL-3.0, which this project can use: it is AGPL-3.0, and GPLv3
      # section 13 exists precisely to permit that combination.
      #
      # Without this the studio cannot see an interface's own driver at all,
      # and on hardware whose maker never implemented Windows' low latency
      # shared mode, which is most interfaces, there is then nothing fast left
      # to offer. That is not a small loss, so a failure here stops the build
      # rather than quietly producing a Windows binary that cannot do the one
      # thing this step is for.
      - name: Fetch the ASIO SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url      = 'https://download.steinberg.net/sdk_downloads/ASIO-SDK_2.3.4_2025-10-15.zip'
          $expected = 'd5ebf0c20dd2c5f43771fd0c1418f4b361bf52434ee670097cfa6b3a335e2eca'

          Invoke-WebRequest -Uri $url -OutFile asiosdk.zip

          # Checked rather than trusted: this is a third party download going
          # straight into a binary that other people run.
          $actual = (Get-FileHash asiosdk.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) {
            throw "ASIO SDK checksum mismatch. Expected $expected, got $actual"
          }

          Expand-Archive asiosdk.zip -DestinationPath asiosdk -Force

          # Found rather than assumed, because the folder inside the zip
          # carries the version and the date in its name.
          $header = Get-ChildItem -Path asiosdk -Recurse -Filter iasiodrv.h | Select-Object -First 1
          if (-not $header) { throw "iasiodrv.h is not in the ASIO SDK archive" }

          $sdkRoot = Split-Path (Split-Path $header.FullName -Parent) -Parent
          Write-Host "ASIO SDK at $sdkRoot"
          "AHP_ASIO_SDK_DIR=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Build for both Apple Silicon and Intel so one download covers every Mac.
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      # A Windows build without ASIO cannot reach an audio interface's own
      # driver, which is the whole reason the step above exists. CMake only
      # warns when the SDK is not where it was told to look, and a warning in
      # a thousand lines of configure output is not a thing anybody sees, so
      # the one line that proves ASIO was switched on is matched for and its
      # absence fails the build.
      #
      # Matching the proof rather than the input on purpose. Checking that the
      # path variable was set proves nothing: the step above already throws
      # when the header is missing, so the variable cannot be empty by the
      # time anything looks, and a path that exists but has moved its headers
      # would sail straight through. The CMakeLists message is the only thing
      # that is emitted if and only if JUCE_ASIO was actually defined.
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $log = cmake -B build -DCMAKE_BUILD_TYPE=Release `
                   -DAHP_ASIO_SDK_DIR="${{ env.AHP_ASIO_SDK_DIR }}" 2>&1 | Out-String
          Write-Host $log

          if ($log -notmatch 'ASIO support enabled from') {
            throw "This Windows build has no ASIO support. The SDK was downloaded but CMake did not enable it, so the layout inside the archive has probably changed and CMakeLists is looking in the wrong place."
          }

      - name: Configure
        if: runner.os == 'Linux'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      # The build output is echoed back as GitHub error annotations on
      # failure, so the reason is visible from the run summary and the API
      # without downloading the whole log.
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          if ! cmake --build build --config Release --parallel 2>&1 | tee build.log; then
            grep -iE "error[ :C0-9]" build.log | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi

      # ditto keeps the bundle's symlinks and executable bits intact.
      # Zipping any other way produces an .app that will not launch.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          APP=$(find build -maxdepth 4 -name "*.app" -print -quit)
          echo "Found: $APP"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/ALLHAILPAN-Studio-macOS.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter *.exe | Select-Object -First 1
          Write-Host "Found: $($exe.FullName)"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path $exe.FullName -DestinationPath dist/ALLHAILPAN-Studio-Windows.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          BIN=$(find build -type f -perm -u+x -name "ALLHAILPAN Studio" -print -quit)
          echo "Found: $BIN"
          mkdir -p dist
          zip -j "dist/ALLHAILPAN-Studio-Linux.zip" "$BIN"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ALLHAILPAN-Studio-${{ runner.os }}
          path: dist/*.zip

      # A release is published either by pushing a tag, or by running this
      # workflow from the Actions tab with a tag filled in. The notes come from
      # RELEASE_NOTES.md in the repository, so they are written and reviewed
      # alongside the code they describe.
      - name: Attach to release
        if: >
          needs.tests.result == 'success'
          && (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body_path: RELEASE_NOTES.md
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: ALLHAILPAN Studio ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.release_tag == '' || inputs.prerelease }}
          fail_on_unmatched_files: true
