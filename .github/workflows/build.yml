name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxi-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libglu1-mesa-dev mesa-common-dev

      # Build for both Apple Silicon and Intel so one download covers every Mac.
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Configure
        if: runner.os != 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      # The build output is echoed back as GitHub error annotations on
      # failure, so the reason is visible from the run summary and the API
      # without downloading the whole log.
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          if ! cmake --build build --config Release --parallel 2>&1 | tee build.log; then
            grep -iE "error[ :C0-9]" build.log | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi

      # ditto keeps the bundle's symlinks and executable bits intact.
      # Zipping any other way produces an .app that will not launch.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          APP=$(find build -maxdepth 4 -name "*.app" -print -quit)
          echo "Found: $APP"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/ALLHAILPAN-Studio-macOS.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter *.exe | Select-Object -First 1
          Write-Host "Found: $($exe.FullName)"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path $exe.FullName -DestinationPath dist/ALLHAILPAN-Studio-Windows.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          BIN=$(find build -type f -perm -u+x -name "ALLHAILPAN Studio" -print -quit)
          echo "Found: $BIN"
          mkdir -p dist
          zip -j "dist/ALLHAILPAN-Studio-Linux.zip" "$BIN"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ALLHAILPAN-Studio-${{ runner.os }}
          path: dist/*.zip

      # Pushing a tag like v0.2.0 publishes the release and attaches all three
      # builds to it. The notes come from RELEASE_NOTES.md in the repository,
      # so they are written and reviewed alongside the code they describe.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body_path: RELEASE_NOTES.md
          prerelease: true
          fail_on_unmatched_files: true
